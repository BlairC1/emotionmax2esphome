# LinknLink eMotion Max 2 → ESPHome (LibreTiny, RTL8720CF / LL8720-P module)
#
# Radar: Andar ADT6101P, same TinyFrame protocol as the Hi-Link LD6002B, so the
# native ESPHome ld6002b component owns the UART and the radar's settings.
# Zones: a lean zone engine – 4 rectangle or polygon zones plus 2 exclusion
# zones, set from Home Assistant number/text entities. Coordinates are in mm
# with the sensor at the origin and +Y pointing straight out into the room.
#
# Pin map:
#   PA2/PA3   radar UART (UART1 via build flags below)
#   PA4       IR LEDs – remote_transmitter (hardware PWM carrier on RTL8720C)
#   PA18      IR receiver – own edge-timestamping ISR (LibreTiny digitalRead()
#             tears down the pin interrupt on RTL8720C, breaking remote_receiver)
#   PA0       placeholder remote_receiver – ir_rf_proxy needs one; IRQ detached at boot
#   PA19      radar wake pin (radar header P19)
#   PA7       pinhole button (low at rest, high when pressed)
#   PA11/PA14 OPT3004 SCL/SDA, bit-banged I²C, addr 0x44
#   PA12      status LED red  (common anode → active low, PWM1)
#   PA17      status LED blue (PWM5) – red/blue bi-colour LED, no green die
#   PA15/PA16 log UART (UART2)
#   ?         USB D+/D- – temperature/humidity cable (Broadlink HTS2 / LinknLink
#             THS, SHT3x/SHT4x expected). Pins not mapped yet: press "Temperature
#             Sensor Scan" with the cable plugged in and it finds and saves them.
#
# The radar board sits upside down in the enclosure (radar X and Z inverted):
# keep Upside Down Mounting on.

substitutions:
  device_name: emotion-max-2              # also sets the HA action names (emotion_max_2_send_ir_nec)
  friendly_name: eMotion Max 2

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: LinknLink eMotion Max 2 (ADT6101P)
  project:
    name: BlairC1.emotion-max-2-esphome
    version: "1.1.0"
  platformio_options:
    build_flags:
      # generic-rtl8720cf only defines alternative UART1 pins (PIN_SERIAL1_RX_0/_1),
      # which ESPHome can't match – define them so uart: gets hardware UART1
      - -DPIN_SERIAL1_RX=2u
      - -DPIN_SERIAL1_TX=3u
  on_boot:
    - priority: 600
      then:
        # Flash blue until Home Assistant connects; led_status takes over after
        - lambda: 'id(led_alert) = true;'
        - light.turn_on:
            id: status_rgb
            effect: Boot Flash
        - wait_until:
            condition:
              api.connected:
                state_subscription_only: true   # HA, not an `esphome logs` session
            timeout: 60s
        - script.execute: led_status
    - priority: -100
      then:
        # Disarm the placeholder IR receiver on PA0. Its interrupt handler calls
        # digitalRead(), which on LibreTiny/RTL8720C frees the pin's interrupt
        # inside the ISR and reuses an already-freed GPIO object – heap
        # corruption if PA0 ever sees an edge (it floats: attachInterrupt drops
        # the pull-down). ir_rf_proxy only needs the receiver object to exist.
        - lambda: 'detachInterrupt(0);'
        # Safety net – restored numbers/switch normally trigger this already
        # during setup; mode: restart folds the calls into one write.
        - script.execute: apply_height_window

rtl87xx:
  board: generic-rtl8720cf-2mb-992k
  framework:
    options:
      # LibreTiny's serial RX ring buffer is a compile-time constant (256 bytes by
      # default – uart: rx_buffer_size is ignored on LibreTiny). 256 bytes is only
      # ~22 ms of radar data at 115200, so any longer stall in the main loop drops
      # bytes and can throw the ld6002b parser off. 2048 ≈ 180 ms of headroom.
      LT_SERIAL_BUFFER_SIZE: 2048

logger:
  level: INFO               # DEBUG logs every state publish – costly on this chip
  # No serial logging: on LibreTiny each log line is written to UART2 with a
  # busy-wait (~1 ms per 11 characters at 115200), stalling the main loop – and
  # the radar UART – for every state log. Logs over the API (ESPHome dashboard,
  # `esphome logs`) are unaffected. Set back to 115200 for bench debugging.
  baud_rate: 0

api:
  encryption:
    key: !secret api_encryption_key
  on_client_connected:
    - script.execute: led_status
  on_client_disconnected:
    - script.execute: led_status
  # Send IR from Home Assistant scripts/automations (names follow device_name):
  #   action: esphome.emotion_max_2_send_ir_raw   data: {command: [9000, -4500, ...]}
  #   action: esphome.emotion_max_2_send_ir_nec   data: {address: "0xBF00", command: "0xF20D"}
  actions:
    - action: send_ir_raw
      variables:
        command: int[]
      then:
        - remote_transmitter.transmit_raw:
            transmitter_id: ir_tx
            carrier_frequency: 38kHz
            code: !lambda 'return std::vector<int32_t>(command.begin(), command.end());'
    # Strings so the HA UI accepts hex: "0xBF00" (or decimal "48896")
    - action: send_ir_nec
      variables:
        address: string
        command: string
      then:
        - remote_transmitter.transmit_nec:
            transmitter_id: ir_tx
            address: !lambda 'return (uint16_t) strtoul(address.c_str(), nullptr, 0);'
            command: !lambda 'return (uint16_t) strtoul(command.c_str(), nullptr, 0);'

ota:
  - platform: esphome
    # Without a password anyone on your LAN can flash this device. Add
    # ota_password to secrets.yaml, then uncomment (the next upload still works –
    # the device only starts asking once this build is on it).
    # password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: light    # radio sleeps between beacons (RTL87xx default is none)

globals:
  - id: ir_last_tx_ms        # end of our last IR transmission – receiver ignores echoes
    type: uint32_t
    initial_value: '0'
  - id: ir_last_raw          # last code received on PA18 – replayed by "IR Replay Last Code"
    type: std::vector<int32_t>
  - id: led_alert            # LED is showing boot flash / HA-lost red (not a colour set from HA)
    type: bool
    initial_value: 'false'
  # Temperature cable bus, found by "Temperature Sensor Scan" and kept across reboots
  - id: th_sda
    type: int
    restore_value: true
    initial_value: '-1'
  - id: th_scl
    type: int
    restore_value: true
    initial_value: '-1'
  - id: th_addr
    type: int
    restore_value: true
    initial_value: '0'
  - id: th_scan_req
    type: bool
    initial_value: 'false'
  - id: radar_rx_bytes       # bytes received from the radar – feeds "Radar Data Rate"
    type: uint32_t
    initial_value: '0'

uart:
  id: radar_uart
  rx_pin: PA2
  tx_pin: PA3
  baud_rate: 115200
  # (rx_buffer_size does nothing on LibreTiny – see LT_SERIAL_BUFFER_SIZE above)
  # Diagnostics: count what the radar sends for "Radar Data Rate" (ld6002b
  # still gets every byte).
  debug:
    direction: RX
    dummy_receiver: false
    after:
      timeout: 20ms
    sequence:
      - lambda: 'id(radar_rx_bytes) += bytes.size();'

# ---------------------------------------------------------------------------
# Radar – native component (framing, command queue with ACK/retry,
# cluster-tracked target slots, radar-side settings)
# ---------------------------------------------------------------------------
ld6002b:
  id: adt_radar
  uart_id: radar_uart
  # Radar wake pin (radar header P19). Before each command the component pulses
  # it so a radar in low-power sleep wakes and listens. 200 ms rather than the
  # 50 ms default: with 50 ms the radar woke but occasionally missed the command.
  wakeup_pin: PA19
  wakeup_pulse: 200ms

# ---------------------------------------------------------------------------
# Infrared – native Home Assistant infrared entities via ir_rf_proxy
# ---------------------------------------------------------------------------
remote_transmitter:
  id: ir_tx
  pin: PA4                  # idle low, active high
  carrier_duty_percent: 50%
  non_blocking: true
  on_complete:
    - lambda: 'id(ir_last_tx_ms) = millis();'

remote_receiver:
  id: ir_rx_dummy
  # Never receives anything – ir_rf_proxy just needs a receiver to exist. Its
  # interrupt is detached at boot (see on_boot). PA0 is the download-mode strap;
  # it is only ever an input here.
  pin: PA0

infrared:
  - platform: ir_rf_proxy
    id: ir_proxy_tx
    name: IR Transmitter
    remote_transmitter_id: ir_tx
  - platform: ir_rf_proxy
    id: ir_proxy_rx
    name: IR Receiver
    remote_receiver_id: ir_rx_dummy
    receiver_frequency: 38kHz

# ---------------------------------------------------------------------------
# Status LED – red/blue bi-colour (common anode → inverted). Exposed as an RGB
# light; green is a no-op output, so only reds, blues and purples show.
#   boot: flashing blue until Home Assistant connects
#   HA connected: off (free to use from HA)
#   HA lost for 10 s (or never connected after boot): solid red
# ---------------------------------------------------------------------------
output:
  - platform: libretiny_pwm
    id: led_r
    pin: PA12
    inverted: true
  - platform: libretiny_pwm
    id: led_b
    pin: PA17
    inverted: true
  - platform: template
    id: led_g
    type: float
    write_action:
      - lambda: '// no green die in this LED'

light:
  - platform: rgb
    id: status_rgb
    name: Status LED
    red: led_r
    green: led_g
    blue: led_b
    restore_mode: ALWAYS_OFF
    default_transition_length: 0s
    entity_category: config
    effects:
      - strobe:
          name: Boot Flash
          colors:
            - state: true
              brightness: 100%
              red: 0%
              green: 0%
              blue: 100%
              duration: 250ms
            - state: false
              duration: 250ms

script:
  # Translate the floor-relative height window into the radar's own Z range.
  # The radar filters targets outside it before tracking.
  - id: apply_height_window
    mode: restart
    then:
      - delay: 1s            # coalesce edits to several numbers
      # Wait for ld6002b to read the radar's current range. Never write blind.
      - wait_until:
          condition:
            lambda: 'return !std::isnan(id(radar_z_min).state) && !std::isnan(id(radar_z_max).state);'
          timeout: 30s
      - lambda: |-
          if (std::isnan(id(radar_z_min).state) || std::isnan(id(radar_z_max).state)) {
            ESP_LOGW("height", "Radar hasn't reported its Z range – not writing");
            return;
          }
          float h  = id(sensor_height).state;
          float lo = id(min_detect_height).state;
          float hi = id(max_detect_height).state;
          if (std::isnan(h) || std::isnan(lo) || std::isnan(hi)) return;
          if (hi < lo + 0.1f) {
            ESP_LOGW("height", "Maximum height must be above minimum – using %.2f m", lo + 0.1f);
            hi = lo + 0.1f;
          }
          // Window in room terms (+Z up), relative to the sensor...
          float zlo = lo - h, zhi = hi - h;
          // ...then into the radar's frame, inverted when the board is upside down
          float zmin, zmax;
          if (id(inverse_mounting).state) { zmin = -zhi; zmax = -zlo; }
          else                            { zmin = zlo;  zmax = zhi;  }
          float cur_min = id(radar_z_min).state, cur_max = id(radar_z_max).state;
          if (fabsf(cur_min - zmin) <= 0.005f && fabsf(cur_max - zmax) <= 0.005f) return;

          auto set_min = [&]() { auto c = id(radar_z_min).make_call(); c.set_value(zmin); c.perform(); };
          auto set_max = [&]() { auto c = id(radar_z_max).make_call(); c.set_value(zmax); c.perform(); };
          // The radar rejects min above max, so order the writes so the
          // intermediate range is always valid.
          if (zmin > cur_max) { set_max(); set_min(); }
          else { set_min(); set_max(); }

          ESP_LOGI("height", "Detection window %.2f-%.2f m above floor (sensor at %.2f m%s) -> radar Z %.2f..%.2f",
                   lo, hi, h, id(inverse_mounting).state ? ", upside down" : "", zmin, zmax);

  # Only touches the LED for its own alerts: a colour you set from HA is left
  # alone when other API clients (dashboard logs etc.) come and go.
  - id: led_status
    mode: restart
    then:
      - if:
          condition:
            not:
              api.connected:
                state_subscription_only: true
          then:
            - delay: 10s        # ride out brief reconnects without flashing red
      - if:
          condition:
            api.connected:
              state_subscription_only: true
          then:
            - if:
                condition:
                  lambda: 'return id(led_alert);'
                then:
                  - lambda: 'id(led_alert) = false;'
                  - light.turn_off: status_rgb
          else:
            - lambda: 'id(led_alert) = true;'
            - light.turn_on:
                id: status_rgb
                effect: none
                brightness: 100%
                red: 100%
                green: 0%
                blue: 0%

# ---------------------------------------------------------------------------
# Buttons
# ---------------------------------------------------------------------------
button:
  - platform: restart
    id: do_restart
    name: Restart
  - platform: template
    id: ir_replay
    name: IR Replay Last Code
    icon: mdi:remote
    on_press:
      - if:
          condition:
            lambda: 'return id(ir_last_raw).empty();'
          then:
            - logger.log:
                level: WARN
                tag: ir_tx
                format: "Nothing learned yet – point a remote at the sensor first"
          else:
            - remote_transmitter.transmit_raw:
                transmitter_id: ir_tx
                carrier_frequency: 38kHz
                code: !lambda 'return id(ir_last_raw);'
  - platform: factory_reset
    id: do_factory_reset
    name: Factory Reset
    entity_category: config
  # Probes the free GPIOs for the USB-cable sensor. Press with the cable plugged
  # in; the result shows in "Temperature Sensor Bus" and is saved.
  - platform: template
    id: th_scan
    name: Temperature Sensor Scan
    icon: mdi:magnify-scan
    entity_category: config
    on_press:
      - lambda: 'id(th_scan_req) = true;'

  # Hisense A40KAU (VIDAA) – NEC address 0xBF00. Discrete on/off verified to wake
  # the TV from deep standby; codes from hawkins.id.au, converted to ESPHome order.
  - platform: template
    id: tv_power_on
    name: "TV Power On"
    icon: mdi:power-on
    on_press:
      - remote_transmitter.transmit_nec:
          transmitter_id: ir_tx
          address: 0xBF00
          command: 0x2FD0
  - platform: template
    id: tv_power_off
    name: "TV Power Off"
    icon: mdi:power-off
    on_press:
      - remote_transmitter.transmit_nec:
          transmitter_id: ir_tx
          address: 0xBF00
          command: 0x2ED1
  - platform: template
    id: tv_home
    name: "TV Home"
    icon: mdi:home
    on_press:
      - remote_transmitter.transmit_nec:
          transmitter_id: ir_tx
          address: 0xBF00
          command: 0xED12
  - platform: ld6002b
    ld6002b_id: adt_radar
    auto_interference:
      name: Radar Auto Interference
    clear_interference:
      name: Radar Clear Interference
    reset_detection_area:
      name: Radar Reset Detection Areas
    reset_unattended:
      name: Radar Reset Unattended
    apply_area:
      name: Radar Apply Area
      disabled_by_default: true

# ---------------------------------------------------------------------------
# Binary sensors – occupancy, zones, targets, button
# ---------------------------------------------------------------------------
binary_sensor:
  - platform: template
    name: "Occupancy"
    device_class: occupancy
    id: occupancy
    filters:
      - delayed_off: !lambda return (id(off_delay).state * 1000);

  - platform: template
    name: "Zone 1 Occupancy"
    device_class: occupancy
    id: zone1_occupancy
    filters:
      - delayed_off: !lambda return (id(zone_1_off_delay).state * 1000);
  - platform: template
    name: "Zone 2 Occupancy"
    device_class: occupancy
    id: zone2_occupancy
    filters:
      - delayed_off: !lambda return (id(zone_2_off_delay).state * 1000);
    disabled_by_default: true
  - platform: template
    name: "Zone 3 Occupancy"
    device_class: occupancy
    id: zone3_occupancy
    filters:
      - delayed_off: !lambda return (id(zone_3_off_delay).state * 1000);
    disabled_by_default: true
  - platform: template
    name: "Zone 4 Occupancy"
    device_class: occupancy
    id: zone4_occupancy
    filters:
      - delayed_off: !lambda return (id(zone_4_off_delay).state * 1000);
    disabled_by_default: true

  - platform: template
    name: "Target 1 Active"
    id: target1_active
    entity_category: diagnostic
  - platform: template
    name: "Target 2 Active"
    id: target2_active
    entity_category: diagnostic
  - platform: template
    name: "Target 3 Active"
    id: target3_active
    entity_category: diagnostic

  - platform: gpio
    id: key
    name: Button
    pin:
      number: PA7
      mode: INPUT          # reads low at rest, high when pressed – not inverted
    filters:
      - delayed_on: 20ms
    on_multi_click:
      - timing:
          - ON for at least 10s
        then:
          - button.press: do_factory_reset
      - timing:
          - ON for 5s to 10s
          - OFF for at least 0.1s
        then:
          - button.press: do_restart

# ---------------------------------------------------------------------------
# Sensors
# ---------------------------------------------------------------------------
sensor:
  - platform: template
    name: "Target 1 X"
    id: target1_x
    accuracy_decimals: 0
    unit_of_measurement: 'mm'
    state_class: measurement
    device_class: distance
    entity_category: diagnostic
  - platform: template
    name: "Target 1 Y"
    id: target1_y
    accuracy_decimals: 0
    unit_of_measurement: 'mm'
    state_class: measurement
    device_class: distance
    entity_category: diagnostic
  - platform: template
    name: "Target 2 X"
    id: target2_x
    accuracy_decimals: 0
    unit_of_measurement: 'mm'
    state_class: measurement
    device_class: distance
    entity_category: diagnostic
  - platform: template
    name: "Target 2 Y"
    id: target2_y
    accuracy_decimals: 0
    unit_of_measurement: 'mm'
    state_class: measurement
    device_class: distance
    entity_category: diagnostic
  - platform: template
    name: "Target 3 X"
    id: target3_x
    accuracy_decimals: 0
    unit_of_measurement: 'mm'
    state_class: measurement
    device_class: distance
    entity_category: diagnostic
  - platform: template
    name: "Target 3 Y"
    id: target3_y
    accuracy_decimals: 0
    unit_of_measurement: 'mm'
    state_class: measurement
    device_class: distance
    entity_category: diagnostic
  - platform: template
    name: "Zone 1 Target Count"
    id: zone1_target_count
    accuracy_decimals: 0
    unit_of_measurement: " "
    entity_category: diagnostic
  - platform: template
    name: "Zone 2 Target Count"
    id: zone2_target_count
    accuracy_decimals: 0
    disabled_by_default: true
    unit_of_measurement: " "
    entity_category: diagnostic
  - platform: template
    name: "Zone 3 Target Count"
    id: zone3_target_count
    accuracy_decimals: 0
    disabled_by_default: true
    unit_of_measurement: " "
    entity_category: diagnostic
  - platform: template
    name: "Zone 4 Target Count"
    id: zone4_target_count
    accuracy_decimals: 0
    disabled_by_default: true
    unit_of_measurement: " "
    entity_category: diagnostic
  - platform: template
    name: "Occupancy Mask 1 Target Count"
    id: occupancy_mask_1_target_count
    accuracy_decimals: 0
    disabled_by_default: true
    unit_of_measurement: " "
    entity_category: diagnostic
  - platform: template
    name: "Occupancy Mask 2 Target Count"
    id: occupancy_mask_2_target_count
    accuracy_decimals: 0
    disabled_by_default: true
    unit_of_measurement: " "
    entity_category: diagnostic

  # Native radar target feeds – internal, read by the zone lambda.
  # filters: [] overrides the component's default timeout + 1 s throttle.
  - platform: ld6002b
    ld6002b_id: adt_radar
    target_1:
      x: { id: adt_t1_x, internal: true, filters: [] }
      y: { id: adt_t1_y, internal: true, filters: [] }
      z:
        id: adt_t1_z
        internal: true
        filters:
          - throttle: 1s
        on_value:
          - lambda: |-
              // +up in the room; only publish moves of 5 cm+ (and appear/disappear)
              float z = id(inverse_mounting).state ? -x : x;
              float h = std::isnan(x) ? NAN : id(sensor_height).state + z;
              float cur = id(target1_height).state;
              if (std::isnan(h) != std::isnan(cur) || fabsf(h - cur) >= 0.05f)
                id(target1_height).publish_state(h);
    target_2:
      x: { id: adt_t2_x, internal: true, filters: [] }
      y: { id: adt_t2_y, internal: true, filters: [] }
    target_3:
      x: { id: adt_t3_x, internal: true, filters: [] }
      y: { id: adt_t3_y, internal: true, filters: [] }
  - platform: template
    id: target1_height
    name: Target 1 Height
    entity_category: diagnostic
    unit_of_measurement: m
    device_class: distance
    accuracy_decimals: 2
    update_interval: never
  - platform: template
    id: illuminance
    name: Illuminance
    device_class: illuminance
    state_class: measurement
    unit_of_measurement: lx
    accuracy_decimals: 1
    update_interval: never
  - platform: template
    id: room_temperature
    name: Temperature
    device_class: temperature
    state_class: measurement
    unit_of_measurement: °C
    accuracy_decimals: 1
    update_interval: never
  - platform: template
    id: room_humidity
    name: Humidity
    device_class: humidity
    state_class: measurement
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: never

  # ---- Diagnostics ----
  - platform: uptime           # a reset to ~0 means the device rebooted
    name: Uptime
    entity_category: diagnostic
    update_interval: 60s
  - platform: wifi_signal
    name: Wi-Fi Signal
    entity_category: diagnostic
    update_interval: 60s
  - platform: template
    id: radar_resyncs
    name: Radar Parser Resyncs  # counts since boot; >0 confirms the parser-stall theory
    entity_category: diagnostic
    state_class: total_increasing
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    id: radar_data_rate
    name: Radar Data Rate      # 0 = the radar has stopped talking
    entity_category: diagnostic
    unit_of_measurement: B/s
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never

text_sensor:
  - platform: ld6002b
    ld6002b_id: adt_radar
    ota_version:
      name: Radar Firmware
    work_mode:
      name: Radar Work Mode
  - platform: template
    id: th_bus
    name: Temperature Sensor Bus
    icon: mdi:usb
    entity_category: diagnostic
    update_interval: never

# ---------------------------------------------------------------------------
# Numbers
# ---------------------------------------------------------------------------
number:
  - platform: template
    name: "Occupancy Off Delay"
    id: off_delay
    max_value: 600
    min_value: 0
    step: 1
    optimistic: true
    restore_value: true
    unit_of_measurement: "s"
    initial_value: 15
    entity_category: config
  - platform: template
    name: "Max Distance"
    id: distance
    max_value: 600
    min_value: 0
    unit_of_measurement: "cm"
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 600
    entity_category: config
  - platform: template
    name: "Installation Angle"
    id: installation_angle_ui
    unit_of_measurement: "º"
    min_value: -45
    max_value: 45
    step: 1
    update_interval: never
    optimistic: true
    restore_value: true
    initial_value: 0
    icon: "mdi:angle-acute"
    entity_category: config

  - platform: template
    name: "Zone 1 Occupancy Off Delay"
    id: zone_1_off_delay
    max_value: 600
    min_value: 0
    step: 1
    optimistic: true
    restore_value: true
    unit_of_measurement: "s"
    initial_value: 15
    entity_category: config

  - platform: template
    name: "Zone 2 Occupancy Off Delay"
    id: zone_2_off_delay
    max_value: 600
    min_value: 0
    step: 1
    optimistic: true
    restore_value: true
    unit_of_measurement: "s"
    initial_value: 15
    disabled_by_default: true
