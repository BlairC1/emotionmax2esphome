interval:
  # -------------------------------------------------------------------------
  # Radar watchdog: publishes the radar's data rate every 10 s, logs when the
  # radar goes quiet and when it comes back, and un-sticks the ld6002b parser.
  #
  # Parser stall: if bytes are lost, the parser can lock onto a false frame
  # start whose 1-byte header checksum happens to match (1 in 256). The bogus
  # length is usually over its 1 KB limit, so it logs "Frame too large" and
  # silently skips that many bytes (up to 64 KB) – minutes of radar data,
  # including every command ACK. Real oversized frames don't occur here (point
  # cloud is off), so a large skip is always bogus: reset the parser. Reaching
  # the component's protected state needs the small Peek helper below.
  # -------------------------------------------------------------------------
  - interval: 10s
    then:
      - lambda: |-
          struct Peek : public ld6002b::LD6002BComponent {
            static uint32_t skipping(ld6002b::LD6002BComponent *c) {
              auto *p = static_cast<Peek *>(c);
              return p->parse_state_ == ParseState::DISCARD ? p->discard_remaining_ : 0;
            }
            static void resync(ld6002b::LD6002BComponent *c) { static_cast<Peek *>(c)->reset_parser_(); }
          };
          if (std::isnan(id(radar_resyncs).state)) id(radar_resyncs).publish_state(0);
          uint32_t skip = Peek::skipping(id(adt_radar));
          if (skip > 2048) {
            Peek::resync(id(adt_radar));
            id(radar_resyncs).publish_state(id(radar_resyncs).state + 1);
            ESP_LOGW("radar", "Parser was skipping %u bytes of a bogus frame – resynced", (unsigned) skip);
          }

          static uint32_t silent_since = 0;
          uint32_t b = id(radar_rx_bytes);
          id(radar_rx_bytes) = 0;
          float rate = b / 10.0f;
          if (std::isnan(id(radar_data_rate).state) || fabsf(rate - id(radar_data_rate).state) >= 20.0f || (b == 0) != (id(radar_data_rate).state == 0))
            id(radar_data_rate).publish_state(rate);
          if (b == 0 && silent_since == 0) {
            silent_since = millis();
            // Bytes waiting unread = the radar IS talking but ld6002b isn't reading
            ESP_LOGW("radar", "No radar data read in 10 s (%u bytes waiting unread)",
                     (unsigned) id(radar_uart).available());
          } else if (b > 0 && silent_since != 0) {
            ESP_LOGW("radar", "Radar sending again after %u s of silence", (unsigned) ((millis() - silent_since) / 1000));
            silent_since = 0;
          }

  # -------------------------------------------------------------------------
  # Zone engine
  # -------------------------------------------------------------------------
  - interval: 50ms
    then:
      - lambda: |-
          // Lean zone engine: radar slots -> room frame -> rectangle or polygon zones.
          // Runs every 50 ms (about one radar frame); publishes only what changes.
          static const float DEG2RAD = 3.14159265f / 180.0f;
          const float max_d = id(distance).state * 10.0f;              // cm -> mm
          const float inst  = id(installation_angle_ui).state * DEG2RAD;
          const bool  flip  = id(inverse_mounting).state;
          const bool  poly_mode = id(polygon_zones_enabled).state;   // off = rectangles

          // ---- Polygons ("x:y;x:y;..." in mm), re-parsed only when the text changes ----
          struct Poly { float vx[20]; float vy[20]; int n; };
          static Poly zones[4], excl[2];
          static std::string zone_txt[4], excl_txt[2];
          static bool parsed = false;

          auto parse = [](const std::string &s, Poly &p) {
            p.n = 0;
            size_t pos = 0;
            while (pos < s.length() && p.n < 20) {
              int x, y, used;
              if (sscanf(s.c_str() + pos, "%d:%d%n", &x, &y, &used) != 2) break;
              p.vx[p.n] = (float) x;
              p.vy[p.n] = (float) y;
              p.n++;
              pos += used;
              if (pos < s.length() && s[pos] == ';') pos++;
            }
          };
          auto inside = [](float px, float py, const Poly &p) -> bool {
            if (p.n < 3) return false;
            bool hit = false;
            for (int i = 0, j = p.n - 1; i < p.n; j = i++) {
              if (((p.vy[i] > py) != (p.vy[j] > py)) &&
                  (px < (p.vx[j] - p.vx[i]) * (py - p.vy[i]) / (p.vy[j] - p.vy[i]) + p.vx[i]))
                hit = !hit;
            }
            return hit;
          };

          text::Text *zone_ent[4] = { id(poly_zone_1), id(poly_zone_2), id(poly_zone_3), id(poly_zone_4) };
          text::Text *excl_ent[2] = { id(poly_exclusion_1), id(poly_exclusion_2) };
          for (int z = 0; z < 4; z++)
            if (!parsed || zone_ent[z]->state != zone_txt[z]) { zone_txt[z] = zone_ent[z]->state; parse(zone_txt[z], zones[z]); }
          for (int e = 0; e < 2; e++)
            if (!parsed || excl_ent[e]->state != excl_txt[e]) { excl_txt[e] = excl_ent[e]->state; parse(excl_txt[e], excl[e]); }
          parsed = true;

          // ---- Rectangles (Begin/End in either order) ----
          struct Rect { float x0, x1, y0, y1; };
          auto make_rect = [](number::Number *bx, number::Number *ex, number::Number *by, number::Number *ey) -> Rect {
            return { std::min(bx->state, ex->state), std::max(bx->state, ex->state),
                     std::min(by->state, ey->state), std::max(by->state, ey->state) };
          };
          auto in_rect = [](float x, float y, const Rect &r) -> bool {
            return r.x0 <= x && x <= r.x1 && r.y0 <= y && y <= r.y1;   // false if any bound is NaN
          };
          Rect rzone[4] = {
            make_rect(id(zone1_begin_x), id(zone1_end_x), id(zone1_begin_y), id(zone1_end_y)),
            make_rect(id(zone2_begin_x), id(zone2_end_x), id(zone2_begin_y), id(zone2_end_y)),
            make_rect(id(zone3_begin_x), id(zone3_end_x), id(zone3_begin_y), id(zone3_end_y)),
            make_rect(id(zone4_begin_x), id(zone4_end_x), id(zone4_begin_y), id(zone4_end_y)),
          };
          Rect rmask[2] = {
            make_rect(id(occupancy_mask_1_begin_x), id(occupancy_mask_1_end_x), id(occupancy_mask_1_begin_y), id(occupancy_mask_1_end_y)),
            make_rect(id(occupancy_mask_2_begin_x), id(occupancy_mask_2_end_x), id(occupancy_mask_2_begin_y), id(occupancy_mask_2_end_y)),
          };
          auto in_zone = [&](float x, float y, int z) -> bool { return poly_mode ? inside(x, y, zones[z]) : in_rect(x, y, rzone[z]); };
          auto in_mask = [&](float x, float y, int e) -> bool { return poly_mode ? inside(x, y, excl[e]) : in_rect(x, y, rmask[e]); };

          // ---- Targets (radar metres -> mm, room frame) ----
          float in_x[3] = { id(adt_t1_x).state, id(adt_t2_x).state, id(adt_t3_x).state };
          float in_y[3] = { id(adt_t1_y).state, id(adt_t2_y).state, id(adt_t3_y).state };
          sensor::Sensor *sx[3] = { id(target1_x), id(target2_x), id(target3_x) };
          sensor::Sensor *sy[3] = { id(target1_y), id(target2_y), id(target3_y) };
          binary_sensor::BinarySensor *sact[3] = { id(target1_active), id(target2_active), id(target3_active) };

          int zc[4] = { 0, 0, 0, 0 }, mc[2] = { 0, 0 }, active = 0;
          bool det[3] = { false, false, false };
          float px[3] = { 0, 0, 0 }, py[3] = { 0, 0, 0 };

          for (int t = 0; t < 3; t++) {
            if (std::isnan(in_x[t]) || std::isnan(in_y[t])) continue;
            float x = in_x[t] * 1000.0f, y = in_y[t] * 1000.0f;
            float d = sqrtf(x * x + y * y);
            if (d > max_d) continue;
            if (flip) x = -x;
            if (inst != 0) {
              float a = atan2f(y, x) - inst;
              x = d * cosf(a);
              y = d * sinf(a);
            }
            if (in_mask(x, y, 0)) { mc[0]++; continue; }
            if (in_mask(x, y, 1)) { mc[1]++; continue; }
            det[t] = true;
            px[t] = x;
            py[t] = y;
            active++;
            for (int z = 0; z < 4; z++)
              if (in_zone(x, y, z)) zc[z]++;
          }

          // ---- Presence: immediate (binary sensors only send on change) ----
          id(occupancy).publish_state(active > 0);
          binary_sensor::BinarySensor *zbin[4] = { id(zone1_occupancy), id(zone2_occupancy), id(zone3_occupancy), id(zone4_occupancy) };
          for (int z = 0; z < 4; z++) zbin[z]->publish_state(zc[z] > 0);
          for (int t = 0; t < 3; t++) sact[t]->publish_state(det[t]);

          // ---- Counts: on change ----
          sensor::Sensor *zcnt[4] = { id(zone1_target_count), id(zone2_target_count), id(zone3_target_count), id(zone4_target_count) };
          sensor::Sensor *mcnt[2] = { id(occupancy_mask_1_target_count), id(occupancy_mask_2_target_count) };
          for (int z = 0; z < 4; z++) if (zcnt[z]->state != zc[z]) zcnt[z]->publish_state(zc[z]);
          for (int e = 0; e < 2; e++) if (mcnt[e]->state != mc[e]) mcnt[e]->publish_state(mc[e]);

          // ---- Positions (live target view in HA): at most every 250 ms ----
          static uint32_t last_pos = 0;
          if (millis() - last_pos >= 250) {
            last_pos = millis();
            for (int t = 0; t < 3; t++) {
              float vx = det[t] ? roundf(px[t]) : 0, vy = det[t] ? roundf(py[t]) : 0;
              if (sx[t]->state != vx) sx[t]->publish_state(vx);
              if (sy[t]->state != vy) sy[t]->publish_state(vy);
            }
          }

  # -------------------------------------------------------------------------
  # IR receiver on PA18 → Home Assistant infrared receiver entity.
  # Own interrupt handler that only timestamps edges and never reads the pin
  # (LibreTiny's digitalRead() is what breaks remote_receiver here). On RTL8720C,
  # CHANGE really is both edges, and the receiver idles high, so the first edge
  # of a frame is a falling one (mark start) and the levels simply alternate.
  # -------------------------------------------------------------------------
  - interval: 20ms
    then:
      - lambda: |-
          static const int rx_pin = 18;            // PA18
          static const uint16_t max_edges = 600;   // long AC frames are ~260-600 edges
          static volatile uint32_t edges[max_edges];
          static volatile uint16_t n_edges = 0;
          static volatile uint32_t last_edge = 0;
          static uint32_t e[max_edges];
          static bool attached = false;

          if (!attached) {
            attachInterrupt(rx_pin, []() {
              uint32_t now = micros();             // ISR-safe on this core
              if (now - last_edge > 15000UL) n_edges = 0;   // >15 ms gap = new frame
              if (n_edges < max_edges) edges[n_edges++] = now;
              last_edge = now;
            }, CHANGE);
            attached = true;
            return;
          }

          // Wait until a burst of edges has been followed by 20 ms of silence
          if (n_edges == 0 || (micros() - last_edge) < 20000UL) return;
          __asm volatile("cpsid i" ::: "memory");
          uint16_t n = n_edges;
          for (uint16_t i = 0; i < n; i++) e[i] = edges[i];
          n_edges = 0;
          __asm volatile("cpsie i" ::: "memory");

          if (millis() - id(ir_last_tx_ms) < 300) return;   // our own transmission bouncing back
          if (n < 8) return;                                 // noise

          // Edge 0 = mark start; even intervals are marks (+), odd are spaces (-)
          std::vector<int32_t> raw;
          raw.reserve(n);
          for (uint16_t i = 0; i + 1 < n; i++) {
            int32_t d = (int32_t) (e[i + 1] - e[i]);
            raw.push_back((i % 2 == 0) ? d : -d);
          }
          id(ir_proxy_rx)->on_receive(remote_base::RemoteReceiveData(raw, 25, remote_base::TOLERANCE_MODE_PERCENTAGE));

          ESP_LOGI("ir_rx", "Received %u timings (header %d/%d us)%s", (unsigned) raw.size(),
                   (int) raw[0], (int) raw[1], (n % 2) ? " – odd edge count, possible glitch" : "");

          // Try NEC (most TVs, fans, LED controllers) – gives a short address/command
          remote_base::RemoteReceiveData rd(raw, 25, remote_base::TOLERANCE_MODE_PERCENTAGE);
          auto nec = remote_base::NECProtocol().decode(rd);
          if (nec.has_value()) {
            ESP_LOGI("ir_rx", "NEC address=0x%04X command=0x%04X", nec->address, nec->command);
          } else {
            // Not NEC: dump raw timings, ready to paste into send_ir_raw
            // (chunked: logger line limit). NEC codes skip this – send_ir_nec is
            // simpler, and "IR Replay Last Code" still has the raw version.
            char line[400];
            size_t i = 0;
            int part = 1;
            while (i < raw.size()) {
              size_t pos = 0;
              for (int k = 0; k < 40 && i < raw.size(); k++, i++)
                pos += snprintf(line + pos, sizeof(line) - pos, "%s%d", k ? ", " : "", (int) raw[i]);
              ESP_LOGI("ir_rx", "raw[%d]: %s%s", part++, line, i < raw.size() ? "," : "");
            }
          }
          id(ir_last_raw) = std::move(raw);   // for "IR Replay Last Code"

  # -------------------------------------------------------------------------
  # OPT3004 ambient light sensor – bit-banged I2C (same approach as the RM4s).
  # SCL=PA11, SDA=PA14, address 0x44. Open-drain style: lines are only ever
  # pulled low or released (external pull-ups on the board).
  # Has to be bit-banged: PA14 has no I2C function on the RTL8720CF (I2C0 SDA
  # is only on PA3/PA12/PA16/PA20), and ESPHome's i2c: on LibreTiny is hardware
  # only. A read is well under a millisecond of work every 5 s. digitalRead() is
  # safe here – it only breaks pins that have an interrupt attached.
  # -------------------------------------------------------------------------
  - interval: 5s
    then:
      - lambda: |-
          static const int scl = 11;        // PA11
          static const int sda = 14;        // PA14
          static const uint8_t addr = 0x44;
          static bool configured = false;

          auto pin_lo  = [](int p) { pinMode(p, OUTPUT); digitalWrite(p, LOW); };
          auto pin_rel = [](int p) { pinMode(p, INPUT); };
          auto pin_rd  = [](int p) { return digitalRead(p) == HIGH; };
          auto dly     = []() { delayMicroseconds(5); };

          auto i2c_start = [&]() { pin_rel(sda); pin_rel(scl); dly(); pin_lo(sda); dly(); pin_lo(scl); dly(); };
          auto i2c_stop  = [&]() { pin_lo(sda); dly(); pin_rel(scl); dly(); pin_rel(sda); dly(); };
          auto i2c_wr = [&](uint8_t b) -> bool {
            for (int i = 7; i >= 0; i--) {
              if (b & (1 << i)) pin_rel(sda); else pin_lo(sda);
              dly(); pin_rel(scl); dly(); pin_lo(scl); dly();
            }
            pin_rel(sda); dly(); pin_rel(scl); dly();
            bool ack = !pin_rd(sda);
            pin_lo(scl); dly();
            return ack;
          };
          auto i2c_rd = [&](bool ack) -> uint8_t {
            uint8_t b = 0;
            pin_rel(sda);
            for (int i = 7; i >= 0; i--) {
              dly(); pin_rel(scl); dly();
              if (pin_rd(sda)) b |= (1 << i);
              pin_lo(scl);
            }
            if (ack) pin_lo(sda); else pin_rel(sda);
            dly(); pin_rel(scl); dly(); pin_lo(scl); pin_rel(sda);
            return b;
          };
          auto reg_read = [&](uint8_t reg, uint16_t &val) -> bool {
            i2c_start();
            if (!i2c_wr(addr << 1) || !i2c_wr(reg)) { i2c_stop(); return false; }
            i2c_start();
            if (!i2c_wr((addr << 1) | 1)) { i2c_stop(); return false; }
            uint8_t msb = i2c_rd(true), lsb = i2c_rd(false);
            i2c_stop();
            val = (msb << 8) | lsb;
            return true;
          };
          auto reg_write = [&](uint8_t reg, uint16_t val) -> bool {
            i2c_start();
            bool ok = i2c_wr(addr << 1) && i2c_wr(reg) && i2c_wr(val >> 8) && i2c_wr(val & 0xFF);
            i2c_stop();
            return ok;
          };

          if (!configured) {
            // Auto-range, 800 ms conversions, continuous mode
            configured = reg_write(0x01, 0xCC10);
            return;
          }

          uint16_t res = 0;
          if (!reg_read(0x00, res)) {
            ESP_LOGW("lux", "OPT3004 read failed");
            configured = false;   // reconfigure on the next pass
            return;
          }
          float lux = 0.01f * (float) (1u << (res >> 12)) * (float) (res & 0x0FFF);

          // Read every 5 s, but only publish a real change (>10 % and >0.5 lx,
          // so dark-room noise stays quiet) or every 5 min as a heartbeat.
          static uint32_t last_pub = 0;
          float last = id(illuminance).state;
          if (std::isnan(last) || millis() - last_pub >= 300000UL ||
              fabsf(lux - last) > std::max(0.5f, 0.1f * last)) {
            id(illuminance).publish_state(lux);
            last_pub = millis();
          }
  # -------------------------------------------------------------------------
  # Temperature/humidity cable on the USB data lines (Broadlink HTS2 /
  # LinknLink THS – an SHT3x-class sensor talking I2C over D+/D-, powered from
  # the charger's 5 V). Bit-banged like the OPT3004.
  #
  # Which GPIOs D+/D- reach isn't mapped, so "Temperature Sensor Scan" works
  # it out: it checks the unused pins below, skips any that something holds
  # low, then tries each pair as SDA/SCL looking for a sensor. Found pins are
  # saved (globals th_sda/th_scl/th_addr) and used from then on. The scan only
  # runs when you press the button, because it briefly pulls unknown pins low –
  # if one of them turned out to be wired to the radar, the radar could need a
  # power cycle afterwards.
  #
  # Reads every 15 s without blocking: each pass collects the previous
  # measurement and starts the next one.
  # -------------------------------------------------------------------------
  - interval: 1s
    then:
      - lambda: |-
          static const int cand[] = { 8, 9, 10, 13, 20, 23 };   // free GPIOs. Never PA0: its placeholder IRQ left a freed GPIO object behind, so pinMode() there would corrupt the heap
          static uint32_t tick = 0;
          static bool first = true, pending = false;
          static int type = 0;                // 0 = not identified, 3 = SHT3x, 4 = SHT4x
          static uint8_t fails = 0;
          static uint32_t last_t_pub = 0, last_h_pub = 0;
          int sda = id(th_sda), scl = id(th_scl);

          auto lo  = [](int p) { pinMode(p, OUTPUT); digitalWrite(p, LOW); };
          auto rel = [](int p) { pinMode(p, INPUT_PULLUP); };   // internal pull-up helps on a 2 m cable
          auto rd  = [](int p) { return digitalRead(p) == HIGH; };
          auto dly = []() { delayMicroseconds(20); };            // ~20 kHz – gentle on a long cable
          auto scl_hi = [&]() {                                    // release SCL, allow clock stretching
            rel(scl);
            for (int i = 0; i < 50 && !rd(scl); i++) delayMicroseconds(20);
          };
          auto start = [&]() { rel(sda); scl_hi(); dly(); lo(sda); dly(); lo(scl); dly(); };
          auto stop  = [&]() { lo(sda); dly(); scl_hi(); dly(); rel(sda); dly(); };
          auto wr = [&](uint8_t b) -> bool {
            for (int i = 7; i >= 0; i--) {
              if (b & (1 << i)) rel(sda); else lo(sda);
              dly(); scl_hi(); dly(); lo(scl);
            }
            rel(sda); dly(); scl_hi(); dly();
            bool ack = !rd(sda);
            lo(scl); dly();
            return ack;
          };
          auto rdb = [&](bool ack) -> uint8_t {
            uint8_t b = 0;
            rel(sda);
            for (int i = 7; i >= 0; i--) {
              dly(); scl_hi(); dly();
              if (rd(sda)) b |= (1 << i);
              lo(scl);
            }
            if (ack) lo(sda); else rel(sda);
            dly(); scl_hi(); dly(); lo(scl); rel(sda);
            return b;
          };
          auto probe = [&](uint8_t a) -> bool { start(); bool ok = wr(a << 1); stop(); return ok; };
          auto crc8 = [](uint8_t a, uint8_t b) -> uint8_t {   // Sensirion CRC-8, poly 0x31
            uint8_t c = 0xFF, d[2] = { a, b };
            for (int i = 0; i < 2; i++) {
              c ^= d[i];
              for (int k = 0; k < 8; k++) c = (c & 0x80) ? (uint8_t) ((c << 1) ^ 0x31) : (uint8_t) (c << 1);
            }
            return c;
          };
          auto show = [](int s, int c, int a) {
            char buf[64];
            snprintf(buf, sizeof(buf), "SDA PA%d, SCL PA%d, address 0x%02X", s, c, a);
            id(th_bus).publish_state(buf);
          };

          if (first) {
            first = false;
            if (sda >= 0 && scl >= 0) show(sda, scl, id(th_addr));
            else id(th_bus).publish_state("Not found yet – plug in the cable and press Temperature Sensor Scan");
          }

          // ---- Scan (button) ----
          if (id(th_scan_req)) {
            id(th_scan_req) = false;
            ESP_LOGI("th", "Scanning free GPIOs for the temperature cable...");
            std::vector<int> up;
            for (int p : cand) {
              pinMode(p, INPUT);        delayMicroseconds(200); bool f = rd(p);
              pinMode(p, INPUT_PULLUP); delayMicroseconds(500); bool u = rd(p);
              pinMode(p, INPUT);
              ESP_LOGI("th", "  PA%d: %s on its own, %s with pull-up%s", p, f ? "high" : "low",
                       u ? "high" : "low", u ? "" : " – held low by something, skipped");
              if (u) up.push_back(p);
            }
            static const uint8_t addrs[] = { 0x44, 0x45, 0x38, 0x40, 0x70 };
            int fs = -1, fc = -1, fa = -1;
            for (int a : up) {
              for (int b : up) {
                if (a == b || fs >= 0) continue;
                sda = a; scl = b;
                rel(sda); rel(scl); dly();
                if (probe(0x13)) continue;      // ACKs an address nothing uses = not a real bus
                for (uint8_t ad : addrs)
                  if (probe(ad)) { fs = a; fc = b; fa = ad; break; }
              }
            }
            for (int p : up) pinMode(p, INPUT);

            if (fa == 0x44 || fa == 0x45) {
              ESP_LOGI("th", "Found a sensor at 0x%02X: SDA=PA%d SCL=PA%d – saved", fa, fs, fc);
              id(th_sda) = fs; id(th_scl) = fc; id(th_addr) = fa;
              type = 0; pending = false; fails = 0; tick = 14;   // start measuring on the next pass
              show(fs, fc, fa);
            } else if (fa > 0) {
              ESP_LOGW("th", "Found an unexpected chip at 0x%02X (SDA=PA%d SCL=PA%d) – not an SHT; send this log", fa, fs, fc);
              char buf[64];
              snprintf(buf, sizeof(buf), "Unknown chip 0x%02X on SDA PA%d, SCL PA%d", fa, fs, fc);
              id(th_bus).publish_state(buf);
            } else {
              ESP_LOGW("th", "No sensor found on PA8/9/10/13/20/23 – send this log");
              id(th_bus).publish_state("Scan found nothing – see log");
            }
            return;
          }

          // ---- Measure every 15 s ----
          if (sda < 0 || scl < 0) return;
          if (++tick % 15 != 0) return;
          const uint8_t ad = (uint8_t) id(th_addr);

          auto fail = [&](const char *why) {
            if (++fails == 3) {
              ESP_LOGW("th", "Temperature sensor not responding (%s) – unplugged?", why);
              id(room_temperature).publish_state(NAN);
              id(room_humidity).publish_state(NAN);
              type = 0;                         // identify it again when it comes back
            }
          };

          if (pending) {
            pending = false;
            uint8_t d[6] = { 0 };
            start();
            bool ok = wr((ad << 1) | 1);
            if (ok) for (int i = 0; i < 6; i++) d[i] = rdb(i < 5);
            stop();
            if (!ok) {
              fail("no reply");
            } else if (crc8(d[0], d[1]) != d[2] || crc8(d[3], d[4]) != d[5]) {
              fail("bad checksum");
            } else {
              if (fails >= 3) ESP_LOGI("th", "Temperature sensor back");
              fails = 0;
              uint16_t rt = (d[0] << 8) | d[1], rh = (d[3] << 8) | d[4];
              float t = -45.0f + 175.0f * rt / 65535.0f + id(temp_offset).state;
              float h = (type == 4) ? -6.0f + 125.0f * rh / 65535.0f : 100.0f * rh / 65535.0f;
              h = std::min(100.0f, std::max(0.0f, h));
              // Publish real changes (0.1 °C / 1 %RH) or every 5 min as a heartbeat
              float lt = id(room_temperature).state, lh = id(room_humidity).state;
              if (std::isnan(lt) || fabsf(t - lt) >= 0.1f || millis() - last_t_pub >= 300000UL) {
                id(room_temperature).publish_state(t);
                last_t_pub = millis();
              }
              if (std::isnan(lh) || fabsf(h - lh) >= 1.0f || millis() - last_h_pub >= 300000UL) {
                id(room_humidity).publish_state(h);
                last_h_pub = millis();
              }
            }
          }

          // Start the next measurement (identifying the chip first if needed)
          bool started = false;
          if (type == 0 || type == 3) {
            start(); started = wr(ad << 1) && wr(0x24) && wr(0x00); stop();   // SHT3x single shot, high rep.
            if (started && type == 0) { type = 3; ESP_LOGI("th", "SHT3x-type sensor at 0x%02X", ad); }
          }
          if (!started && (type == 0 || type == 4)) {
            start(); started = wr(ad << 1) && wr(0xFD); stop();               // SHT4x high precision
            if (started && type == 0) { type = 4; ESP_LOGI("th", "SHT4x-type sensor at 0x%02X", ad); }
          }
          if (started) pending = true;
          else fail("no ACK");
